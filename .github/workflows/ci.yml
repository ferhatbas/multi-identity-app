name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backends/dotnet/global.json
      - run: dotnet test backends/dotnet/tests/FSIdentity.Tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontends/web-react-vite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontends/web-react-vite/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run i18n
