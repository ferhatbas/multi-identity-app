# Local development infrastructure shared by every backend (dotnet, py, rs).
#
#   cd devops
#   cp .env.example .env        # then set a strong MSSQL_SA_PASSWORD
#   docker compose up -d
#
# Connection string (all backends):
#   Server=localhost,1435;Database=FSIDENTITY;User Id=sa;Password=<MSSQL_SA_PASSWORD>;TrustServerCertificate=True

name: fsidentity

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fsidentity-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in devops/.env}
    ports:
      - "${MSSQL_PORT:-1435}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Creates the application database once SQL Server is healthy.
  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fsidentity-mssql-init
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_NAME: ${DB_NAME:-FSIDENTITY}
    entrypoint:
      - /bin/bash
      - -c
      - >
        /opt/mssql-tools18/bin/sqlcmd -C -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -b
        -Q "IF DB_ID('$$DB_NAME') IS NULL CREATE DATABASE [$$DB_NAME];"
    restart: "no"

  # One-shot: creates the schema and loads the reference data, then exits.
  api-setup:
    build: ../backends/dotnet
    image: fsidentity-api
    container_name: fsidentity-api-setup
    depends_on:
      mssql-init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Default: Server=mssql,1433;Database=${DB_NAME:-FSIDENTITY};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in devops/.env (32+ random characters)}
    entrypoint: ["/bin/sh", "-c", "dotnet FSIdentity.Api.dll --migrate && dotnet FSIdentity.Api.dll --seed"]
    restart: "no"

  api:
    image: fsidentity-api
    container_name: fsidentity-api
    restart: unless-stopped
    depends_on:
      api-setup:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Default: Server=mssql,1433;Database=${DB_NAME:-FSIDENTITY};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in devops/.env (32+ random characters)}
    ports:
      - "${API_PORT:-5240}:8080"

  web:
    build: ../frontends/web-react-vite
    image: fsidentity-web
    container_name: fsidentity-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3041}:80"

  # Development only (profile "dev"): the Vite dev server with hot module reloading, on http://localhost:3040.
  # The source is mounted from ../frontends/web-react-vite, so saving a file updates the open browser tab at once.
  #   docker compose --profile dev up -d web-dev
  web-dev:
    profiles: ["dev"]
    image: node:22-alpine
    container_name: fsidentity-web-dev
    working_dir: /app
    depends_on:
      - api
    environment:
      API_TARGET: http://api:8080
      VITE_HOST: 0.0.0.0
      VITE_USE_POLLING: "true"
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    ports:
      - "${WEB_DEV_PORT:-3040}:3040"
    volumes:
      - ../frontends/web-react-vite:/app
      - web-dev-node-modules:/app/node_modules

volumes:
  mssql-data:
  web-dev-node-modules:
